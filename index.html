<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Firebase Test PWA</title>
  <link rel="manifest" href="test-manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin: 12px 0;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .user-info {
      background: #f1f3f4;
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
      text-align: left;
    }
    .hidden { display: none; }
    #status { color: #1e8e3e; font-weight: 500; margin: 12px 0; }
    .error { color: #d32f2f; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔥 Firebase Test PWA</h1>
  <p>Click below to sign in with Google (redirect flow)</p>
  <button id="loginBtn">Sign in with Google</button>
  <button id="logoutBtn" class="hidden">Sign Out</button>
  <div id="userInfo" class="hidden user-info"></div>
  <div id="status"></div>
  <div style="margin-top: 24px; font-size: 12px; color: #666;">PWA Test – no data stored<br>🔐 Works offline after first load</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    GoogleAuthProvider, 
    signInWithRedirect, 
    getRedirectResult, 
    signOut, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAYQd-tzlpMYmbWL3KcWd-BO7jQGwoJJiQ",
    authDomain: "ecosaver-9a4f8.firebaseapp.com",
    projectId: "ecosaver-9a4f8",
    storageBucket: "ecosaver-9a4f8.firebasestorage.app",
    messagingSenderId: "1050035280306",
    appId: "1:1050035280306:web:2d30a176f4eec090936cab",
    measurementId: "G-8Y17X16T68"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userInfoDiv = document.getElementById('userInfo');
  const statusDiv = document.getElementById('status');

  let isProcessing = false;

  async function handleLogin() {
    if (isProcessing) return;
    isProcessing = true;
    loginBtn.disabled = true;
    statusDiv.textContent = "Redirecting to Google...";
    statusDiv.classList.remove('error');
    try {
      await signInWithRedirect(auth, provider);
    } catch (error) {
      console.error(error);
      statusDiv.textContent = `❌ Error: ${error.message}`;
      statusDiv.classList.add('error');
      loginBtn.disabled = false;
      isProcessing = false;
    }
  }

  async function handleLogout() {
    try {
      await signOut(auth);
      statusDiv.textContent = "Signed out.";
      statusDiv.classList.remove('error');
    } catch (error) {
      console.error(error);
      statusDiv.textContent = `❌ Sign out failed: ${error.message}`;
      statusDiv.classList.add('error');
    }
  }

  loginBtn.addEventListener('click', handleLogin);
  logoutBtn.addEventListener('click', handleLogout);

  onAuthStateChanged(auth, async (user) => {
    // Process redirect result on every auth change
    try {
      const result = await getRedirectResult(auth);
      if (result?.user) {
        statusDiv.textContent = `✅ Signed in as ${result.user.displayName}`;
        statusDiv.classList.remove('error');
      }
    } catch (error) {
      console.error("Redirect result error:", error);
      statusDiv.textContent = `❌ Redirect error: ${error.message}. Check Firebase console: Authorized domains and redirect URIs must include this page.`;
      statusDiv.classList.add('error');
    }

    // Update UI based on final auth state
    if (user) {
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      userInfoDiv.classList.remove('hidden');
      userInfoDiv.innerHTML = `
        <strong>✅ Authenticated</strong><br>
        Name: ${user.displayName}<br>
        Email: ${user.email}<br>
        UID: ${user.uid}<br>
        <img src="${user.photoURL}" width="48" style="border-radius: 50%; margin-top: 8px;">
      `;
      statusDiv.textContent = `Welcome, ${user.displayName}!`;
      statusDiv.classList.remove('error');
    } else {
      loginBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      userInfoDiv.classList.add('hidden');
      if (!statusDiv.textContent.includes("Redirect error")) {
        statusDiv.textContent = "Not signed in.";
        statusDiv.classList.remove('error');
      }
    }
    loginBtn.disabled = false;
    isProcessing = false;
  });
</script>

<script>
  // Register service worker for offline capability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('test-sw.js').then(reg => {
        console.log('Service Worker registered', reg);
      }).catch(err => {
        console.error('SW registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
