<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Firebase Test PWA</title>
  <link rel="manifest" href="test-manifest.json">
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin: 12px 0;
      transition: transform 0.1s;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button:active:not(:disabled) { transform: scale(0.96); }
    .user-info {
      background: #f1f3f4;
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
      text-align: left;
      word-break: break-all;
    }
    .hidden { display: none; }
    #status { color: #1e8e3e; font-weight: 500; margin: 12px 0; min-height: 20px; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔥 Firebase Test PWA</h1>
  <p>Click below to sign in with Google<br><small style="color:#666;">(Mobile Redirect Flow)</small></p>
  
  <button id="loginBtn">Sign in with Google</button>
  <button id="logoutBtn" class="hidden">Sign Out</button>
  
  <div id="userInfo" class="hidden user-info"></div>
  <div id="status">Checking authentication status...</div>
  
  <div style="margin-top: 24px; font-size: 12px; color: #666;">PWA Test – no data stored<br>🔒 Works offline after first load</div>
</div>

<script type="module">
  // 1. Import correct mobile-safe Firebase modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 2. Verified configuration credentials object
    const firebaseConfig = {
    apiKey: "AIzaSyAYQd-tzlpMYmbWL3Kcwd-BO7jQGwoJJiQ", // Fixed lowercase 'c'
    authDomain: "ecosaver-9a4f8.firebaseapp.com",
    projectId: "ecosaver-9a4f8",
    storageBucket: "ecosaver-9a4f8.firebasestorage.app",
    messagingSenderId: "1050035280306",
    appId: "1:1050035280306:web:2d30a176f4eec090936cab",
    measurementId: "G-8Y17X16T68"
  };


  // 3. Initialize App and services
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  
  // Force accounts panel to appear during redirect handshakes
  provider.setCustomParameters({ prompt: 'select_account' });

  // DOM Elements references
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userInfoDiv = document.getElementById('userInfo');
  const statusDiv = document.getElementById('status');

  // 4. Handle Login trigger
  async function handleLogin() {
    loginBtn.disabled = true;
    statusDiv.style.color = "#1e8e3e";
    statusDiv.textContent = "Redirecting to Google...";
    try {
      // Execute standard mobile window shift
      await signInWithRedirect(auth, provider);
    } catch (error) {
      console.error("Login trigger error:", error);
      statusDiv.style.color = "#d93025";
      statusDiv.textContent = `❌ Error: ${error.message}`;
      loginBtn.disabled = false;
    }
  }

  // 5. Handle Logout trigger
  async function handleLogout() {
    try {
      statusDiv.textContent = "Signing out...";
      await signOut(auth);
      statusDiv.style.color = "#1e8e3e";
      statusDiv.textContent = "Signed out successfully.";
    } catch (error) {
      console.error("Logout error:", error);
      statusDiv.style.color = "#d93025";
      statusDiv.textContent = `❌ Sign out failed: ${error.message}`;
    }
  }

  // Bind core element events
  loginBtn.addEventListener('click', handleLogin);
  logoutBtn.addEventListener('click', handleLogout);

  // 6. Handle inbound tokens returned from redirect
  getRedirectResult(auth)
    .then((result) => {
      if (result?.user) {
        statusDiv.style.color = "#1e8e3e";
        statusDiv.textContent = `✅ Successfully authenticated as ${result.user.displayName}`;
      }
    })
    .catch((error) => {
      console.error("Redirect resolution crash:", error);
      statusDiv.style.color = "#d93025";
      statusDiv.textContent = `❌ Auth Link Failure: ${error.message}`;
      loginBtn.disabled = false;
    });

  // 7. Track user session state persistent frames
  onAuthStateChanged(auth, (user) => {
    loginBtn.disabled = false;
    if (user) {
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      userInfoDiv.classList.remove('hidden');
      userInfoDiv.innerHTML = `
        <strong>📋 Account Information</strong><br>
        <strong>Name:</strong> ${user.displayName || 'N/A'}<br>
        <strong>Email:</strong> ${user.email}<br>
        <strong>UID:</strong> <span style="font-size:11px;color:#555;">${user.uid}</span><br>
        ${user.photoURL ? `<img src="${user.photoURL}" width="50" style="border-radius: 50%; margin-top: 12px; border: 2px solid #1a73e8;">` : ''}
      `;
      statusDiv.style.color = "#1e8e3e";
      statusDiv.textContent = `Welcome back, ${user.displayName || 'User'}!`;
    } else {
      loginBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      userInfoDiv.classList.add('hidden');
      userInfoDiv.innerHTML = '';
      statusDiv.style.color = "#666";
      statusDiv.textContent = "Not signed in.";
    }
  });
</script>
</body>
</html>
